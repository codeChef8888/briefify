[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefify"
version = "0.1.0"
description = "AI-powered account telemetry briefing tool via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "google-cloud-bigquery>=3.0",
    "google-genai>=1.0",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
asyncio_mode = "auto"
